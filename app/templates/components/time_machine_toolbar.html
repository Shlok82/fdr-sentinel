<div class="bg-navy-900 border-b border-slate-700 text-white px-4 py-2 text-xs shadow-inner">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center space-x-2">
            <span class="inline-block w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
            <span class="font-bold tracking-wide text-amber-400 uppercase text-[11px]">Demo Time Machine</span>
            <span class="text-slate-400">|</span>
            <span class="text-slate-300">Clock: <strong class="font-mono text-white">{{ current_time }}</strong></span>
            {% if is_simulated %}
            <span class="bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded text-[10px] font-mono border border-amber-500/40">Offset Active</span>
            {% endif %}
        </div>

        <div class="flex items-center space-x-1.5" role="group" aria-label="Time Machine Controls">
            <span class="text-slate-400 mr-1 text-[11px]">Advance Horizon:</span>
            
            <form hx-post="/api/v1/demo/clock" hx-target="#time-machine-container" class="inline">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="action" value="+30d">
                <button type="submit" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 hover:text-white px-2.5 py-1 rounded font-mono font-medium border border-slate-600 transition focus:outline-none focus:ring-1 focus:ring-amber-400">
                    +30d
                </button>
            </form>

            <form hx-post="/api/v1/demo/clock" hx-target="#time-machine-container" class="inline">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="action" value="+60d">
                <button type="submit" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 hover:text-white px-2.5 py-1 rounded font-mono font-medium border border-slate-600 transition focus:outline-none focus:ring-1 focus:ring-amber-400">
                    +60d
                </button>
            </form>

            <form hx-post="/api/v1/demo/clock" hx-target="#time-machine-container" class="inline">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="action" value="+90d">
                <button type="submit" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 hover:text-white px-2.5 py-1 rounded font-mono font-medium border border-slate-600 transition focus:outline-none focus:ring-1 focus:ring-amber-400">
                    +90d
                </button>
            </form>

            <form hx-post="/api/v1/demo/clock" hx-target="#time-machine-container" class="inline">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="action" value="+1y">
                <button type="submit" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 hover:text-white px-2.5 py-1 rounded font-mono font-medium border border-slate-600 transition focus:outline-none focus:ring-1 focus:ring-amber-400">
                    +1y
                </button>
            </form>

            <form hx-post="/api/v1/demo/clock" hx-target="#time-machine-container" class="inline">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="action" value="reset">
                <button type="submit" class="bg-rose-900/50 hover:bg-rose-800 active:bg-rose-700 text-rose-200 hover:text-white px-2.5 py-1 rounded font-medium border border-rose-700 transition focus:outline-none focus:ring-1 focus:ring-rose-400">
                    Reset
                </button>
            </form>
        </div>
    </div>
</div>
