{% extends "base.html" %}

{% block title %}{{ role_title }} | FDR Sentinel{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="bg-white rounded-xl border border-slate-200 p-6 sm:p-8 shadow-sm">
        <div class="flex items-center space-x-3">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-purple-100 text-purple-800 border border-purple-200">
                {{ user.role }}
            </span>
            <span class="text-xs text-slate-400">Competent Authority Workstation</span>
        </div>
        <h1 class="mt-3 text-2xl font-bold text-slate-900 tracking-tight">{{ role_title }}</h1>
        <p class="mt-2 text-sm text-slate-600 max-w-3xl leading-relaxed">{{ role_description }}</p>

        <div class="mt-6 border-t border-slate-100 pt-6">
            <div class="rounded-lg bg-amber-50 border border-amber-200 p-4 text-xs text-amber-900 flex items-start space-x-3">
                <span class="font-bold text-amber-700">Stage 3 Active:</span>
                <span>Authentication and RBAC shell successfully mounted. {{ stage_note }}</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
