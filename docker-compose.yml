services:
  db:
    image: postgres:16-alpine
    container_name: fdr_sentinel_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fdr_sentinel
      POSTGRES_USER: fdr_owner
      POSTGRES_PASSWORD: fdr_owner_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdr_owner -d fdr_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fdr_sentinel_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      ENVIRONMENT: development
      DEBUG: "true"
      DEMO_MODE: "true"
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: fdr_sentinel
      POSTGRES_USER: fdr_owner
      POSTGRES_PASSWORD: fdr_owner_dev_password
      DATABASE_OWNER_URL: postgresql+psycopg://fdr_owner:fdr_owner_dev_password@db:5432/fdr_sentinel
      DATABASE_URL: postgresql+psycopg://fdr_app_user:fdr_app_dev_password@db:5432/fdr_sentinel
      TEST_OWNER_DATABASE_URL: postgresql+psycopg://fdr_owner:fdr_owner_dev_password@db:5432/fdr_sentinel_test
      TEST_DATABASE_URL: postgresql+psycopg://fdr_app_user:fdr_app_dev_password@db:5432/fdr_sentinel_test
      SECRET_KEY: dev_secret_key_change_in_production_min_32_chars_long
      DOCUMENT_MASTER_KEY: k8T0a7Z3Yx9L1q4W7e2R5t8Y1u4I7o0P3s6D9f2G5h8=
      SEED_PASSWORD: ${SEED_PASSWORD}
      DEMO_SHOW_CREDENTIALS: ${DEMO_SHOW_CREDENTIALS:-false}
      UPLOAD_STORAGE_PATH: /app/storage
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage

volumes:
  postgres_data:
